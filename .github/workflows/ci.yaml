name: Verify recipes

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Recettes
        run: uv tool install recettes
      - name: Lint recipe folder
        run: recettes lint recipes
